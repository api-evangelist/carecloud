aid: carecloud
name: Carecloud
description: 'CareCloud (NASDAQ: CCLD, formerly MTBC) is a cloud-based healthcare
  technology company serving 45,000+ providers with an integrated platform spanning
  electronic health records (EHR), practice management, revenue cycle management (RCM),
  patient experience tools, and AI-driven clinical documentation (cirrusAI). Its
  Connector product delivers healthcare interoperability with FHIR and C-CDA data
  exchange across labs, EHRs, immunization registries, and diagnostics. CareCloud is
  Drummond-certified ONC Health IT and Surescripts-certified, publishes HIPAA
  compliance content, and operates a developer portal (AWS API Gateway) at
  developer.carecloud.com. Surfaced as a portfolio company of Norwest Venture
  Partners and enriched in the API Evangelist network.'
